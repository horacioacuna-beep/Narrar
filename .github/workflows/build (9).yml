name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Crear proyecto y compilar
        run: |
          set -e
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          sudo mkdir -p $SDK/licenses
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' | sudo tee $SDK/licenses/android-sdk-license > /dev/null
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' | sudo tee $SDK/licenses/android-sdk-preview-license > /dev/null
          echo "sdk.dir=$SDK" > local.properties
          mkdir -p app
          cat > app/build.gradle <<'EOF_0'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.narrador.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.narrador.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF_0
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true" android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".NarradorService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF_1
          mkdir -p app/src/main/java/com/narrador/app
          cat > app/src/main/java/com/narrador/app/MainActivity.kt <<'EOF_2'
          package com.narrador.app
          
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          
          // Sin pantalla: al tocar el icono de la app abre directamente el panel del Narrador.
          // Si el servicio no está activo, lleva directo a los ajustes de accesibilidad.
          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val s = NarradorService.instance
                  if (s != null) {
                      s.openFromShortcut()
                  } else {
                      Toast.makeText(this, "Activa «Narrador» en esta lista (si ya estaba, apágalo y enciéndelo)", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  finish()
              }
          }
          EOF_2
          mkdir -p app/src/main/java/com/narrador/app
          cat > app/src/main/java/com/narrador/app/NarradorService.kt <<'EOF_3'
          package com.narrador.app
          
          import android.accessibilityservice.AccessibilityButtonController
          import android.accessibilityservice.AccessibilityService
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import android.view.Display
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.Locale
          
          class NarradorService : AccessibilityService(), TextToSpeech.OnInitListener {
          
              companion object {
                  @Volatile var instance: NarradorService? = null
              }
          
              fun openFromShortcut() { main.post { if (panel == null) openPanel() } }
          
              private val LANGS = listOf(
                  "es" to "Español", "en" to "English", "pt" to "Português", "fr" to "Français",
                  "de" to "Deutsch", "it" to "Italiano", "ja" to "日本語", "ko" to "한국어",
                  "zh-CN" to "中文", "ru" to "Русский", "ar" to "العربية", "hi" to "हिन्दी"
              )
          
              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
          
              private var tab: View? = null
              private var panel: View? = null
              private var card: View? = null
              private var playBtn: TextView? = null
              private var rateLbl: TextView? = null
              private var voiceBtn: TextView? = null
              private var langBtn: TextView? = null
          
              private var q: List<String> = emptyList()
              private var idx = 0
              private var playing = false
              private var speakLang: String? = null
              private var gen = 0
              private var curId = ""
              private var cardText = ""
              private var prefListener: SharedPreferences.OnSharedPreferenceChangeListener? = null
          
              private var rate = 1f
              private var langIdx = 0
              private var voiceIdx = -1
          
              // ---------- ciclo de vida ----------
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  prefs = getSharedPreferences("nar", MODE_PRIVATE)
                  rate = prefs.getFloat("rate", 1f)
                  langIdx = prefs.getInt("lang", 0).coerceIn(0, LANGS.size - 1)
                  voiceIdx = prefs.getInt("voice", -1)
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tts = TextToSpeech(this, this)
                  if (prefs.getBoolean("showTab", false)) showTab()
                  prefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                      if (key == "showTab") {
                          if (prefs.getBoolean("showTab", false)) { if (tab == null) showTab() } else hideTab()
                      }
                  }
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)
                  // Gesto / botón de accesibilidad del sistema -> abre o cierra el panel
                  if (Build.VERSION.SDK_INT >= 26) {
                      accessibilityButtonController.registerAccessibilityButtonCallback(
                          object : AccessibilityButtonController.AccessibilityButtonCallback() {
                              override fun onClicked(controller: AccessibilityButtonController) { togglePanel() }
                          })
                  }
              }
          
              override fun onInit(status: Int) {
                  ttsReady = status == TextToSpeech.SUCCESS
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) {
                          main.post { if (playing && id == curId) { idx++; speakCurrent() } }
                      }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) {
                          main.post { if (playing && id == curId) { idx++; speakCurrent() } }
                      }
                  })
                  if (!ttsReady) toast("No hay motor de voz instalado")
              }
          
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() { stopAll() }
          
              override fun onDestroy() {
                  instance = null
                  try { prefListener?.let { prefs.unregisterOnSharedPreferenceChangeListener(it) } } catch (_: Exception) {}
                  stopAll()
                  tts?.shutdown()
                  listOf(tab, panel, card).forEach { v -> v?.let { try { wm.removeView(it) } catch (_: Exception) {} } }
                  super.onDestroy()
              }
          
              // ---------- utilidades de UI ----------
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
          
              private fun bg(c1: Int, c2: Int, r: Int) =
                  GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(c1, c2)).apply { cornerRadius = dp(r).toFloat() }
          
              private fun btn(label: String, accent: Boolean = false, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label; t.setTextColor(Color.WHITE); t.textSize = 16f
                  t.typeface = Typeface.DEFAULT_BOLD; t.gravity = Gravity.CENTER
                  t.setPadding(dp(8), dp(12), dp(8), dp(12))
                  t.background = if (accent) bg(0xFFF4561E.toInt(), 0xFFC93A10.toInt(), 14)
                  else bg(0xFF444446.toInt(), 0xFF2A2A2C.toInt(), 14)
                  t.isClickable = true
                  t.setOnClickListener { onClick() }
                  return t
              }
          
              private fun lp(w: Int, h: Int, wt: Float = 0f, top: Int = 0) =
                  LinearLayout.LayoutParams(w, h, wt).apply { topMargin = dp(top) }
          
              private fun row(vararg v: View): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  v.forEach { r.addView(it, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(dp(3), 0, dp(3), 0) }) }
                  return r
              }
          
              private fun sec(t: String) = TextView(this).apply {
                  text = t; setTextColor(0xFFA9A9AE.toInt()); textSize = 13f; typeface = Typeface.DEFAULT_BOLD
                  setPadding(0, dp(18), 0, dp(6))
              }
          
              private fun overlay(w: Int, h: Int) = WindowManager.LayoutParams(
                  w, h, WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                  PixelFormat.TRANSLUCENT
              )
          
              private fun screenW() = resources.displayMetrics.widthPixels
              private fun screenH() = resources.displayMetrics.heightPixels
          
              // ---------- pestaña y panel ----------
              private fun showTab() {
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.gravity = Gravity.CENTER_HORIZONTAL
                  col.setPadding(0, dp(12), 0, dp(14))
                  val r = dp(14).toFloat()
                  col.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(0xFFFF6A35.toInt(), 0xFFD63F14.toInt())).apply {
                      cornerRadii = floatArrayOf(r, r, 0f, 0f, 0f, 0f, r, r)
                  }
                  col.addView(TextView(this).apply { text = "🔊"; textSize = 20f; gravity = Gravity.CENTER })
                  col.addView(TextView(this).apply {
                      text = "N\nA\nR\nR\nA\nD\nO\nR"; setTextColor(Color.WHITE); textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER; setPadding(0, dp(6), 0, 0)
                  })
                  col.setOnClickListener { if (panel == null) openPanel() else closePanel() }
                  val p = overlay(dp(40), WindowManager.LayoutParams.WRAP_CONTENT)
                  p.gravity = Gravity.END or Gravity.CENTER_VERTICAL
                  wm.addView(col, p)
                  tab = col
              }
          
              private fun hideTab() {
                  tab?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  tab = null
              }
          
              private fun togglePanel() { if (panel == null) openPanel() else closePanel() }
          
              private fun moveTab(x: Int) {
                  val t = tab ?: return
                  val p = t.layoutParams as WindowManager.LayoutParams
                  p.x = x
                  wm.updateViewLayout(t, p)
              }
          
              private fun openPanel() {
                  hideCard()
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(14), dp(14), dp(14), dp(24))
          
                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(TextView(this).apply {
                      text = "🔊 NARRADOR"; setTextColor(0xFFFF6A35.toInt()); textSize = 20f; typeface = Typeface.DEFAULT_BOLD
                  }, lp(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  head.addView(btn("✕", true) { closePanel() }, lp(dp(52), LinearLayout.LayoutParams.WRAP_CONTENT))
                  col.addView(head)
          
                  playBtn = btn(if (playing) "⏸" else "▶", true) { togglePlay() }
                  col.addView(row(btn("⏮") { step(-1) }, playBtn!!, btn("⏹") { stopAll() }, btn("⏭") { step(1) }),
                      lp(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT, 0f, 14))
          
                  col.addView(btn("Leer la pantalla", true) { closePanel(); readScreen(false, false) },
                      lp(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT, 0f, 12))
                  col.addView(btn("📄 Leer PDF / EPUB / imagen (OCR)") { closePanel(); readScreen(false, false, true) },
                      lp(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT, 0f, 8))
          
                  col.addView(sec("VELOCIDAD"))
                  rateLbl = TextView(this).apply {
                      setTextColor(0xFFFFB21A.toInt()); textSize = 22f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                  }
                  col.addView(row(btn("−") { changeRate(-0.25f) }, rateLbl!!, btn("+") { changeRate(0.25f) }))
                  updateRate()
          
                  col.addView(sec("VOZ"))
                  voiceBtn = btn("") { cycleVoice() }
                  col.addView(voiceBtn)
                  updateVoiceLabel()
          
                  col.addView(sec("TRADUCIR"))
                  col.addView(btn("🌐 Traducir la pantalla") { closePanel(); readScreen(true, false) })
                  col.addView(btn("🌐🔊 Traducir y leer la pantalla") { closePanel(); readScreen(true, true) },
                      lp(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT, 0f, 8))
                  col.addView(sec("TRADUCIR A"))
                  langBtn = btn("") { langIdx = (langIdx + 1) % LANGS.size; prefs.edit().putInt("lang", langIdx).apply(); updateLang() }
                  col.addView(langBtn)
                  updateLang()
          
                  col.addView(sec("PESTAÑA LATERAL"))
                  val tabOn = prefs.getBoolean("showTab", false)
                  col.addView(btn(if (tabOn) "Ocultar la pestaña naranja" else "Mostrar la pestaña naranja") {
                      prefs.edit().putBoolean("showTab", !tabOn).apply()
                      closePanel()
                  })
          
                  val sv = ScrollView(this)
                  sv.background = bg(0xFF232325.toInt(), 0xFF19191B.toInt(), 18)
                  sv.addView(col)
                  val w = (screenW() * 0.8f).toInt()
                  val p = overlay(w, (screenH() * 0.85f).toInt())
                  p.gravity = Gravity.END or Gravity.CENTER_VERTICAL
                  wm.addView(sv, p)
                  panel = sv
                  moveTab(w)
              }
          
              private fun closePanel() {
                  panel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  panel = null; playBtn = null; rateLbl = null; voiceBtn = null; langBtn = null
                  moveTab(0)
              }
          
              private fun updatePlay() { playBtn?.text = if (playing) "⏸" else "▶" }
              private fun updateRate() { rateLbl?.text = String.format(Locale.US, "%.2f×", rate) }
              private fun updateLang() { langBtn?.text = "🌐 " + LANGS[langIdx].second + "  (tocar para cambiar)" }
          
              private fun voices(): List<Voice> {
                  val all = (tts?.voices ?: emptySet()).filter { !it.isNetworkConnectionRequired }.sortedBy { it.name }
                  val mine = all.filter { it.locale.language == Locale.getDefault().language }
                  return if (mine.isNotEmpty()) mine else all
              }
          
              private fun updateVoiceLabel() {
                  val v = voices().getOrNull(voiceIdx)
                  voiceBtn?.text = "Voz: " + (v?.name ?: "predeterminada") + "  (tocar para cambiar)"
              }
          
              private fun cycleVoice() {
                  val n = voices().size
                  voiceIdx = if (n == 0) -1 else if (voiceIdx + 1 >= n) -1 else voiceIdx + 1
                  prefs.edit().putInt("voice", voiceIdx).apply()
                  updateVoiceLabel()
                  if (playing) speakCurrent()
              }
          
              private fun changeRate(d: Float) {
                  rate = (rate + d).coerceIn(0.5f, 3f)
                  prefs.edit().putFloat("rate", rate).apply()
                  updateRate()
                  if (playing) speakCurrent()
              }
          
              // ---------- tarjeta de traducción ----------
              private fun showCard(t: String) {
                  hideCard()
                  cardText = t
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(14), dp(12), dp(14), dp(12))
                  col.background = bg(0xF21C1C1E.toInt(), 0xF21C1C1E.toInt(), 20)
                  col.addView(TextView(this).apply {
                      text = "🌐 Traducción → " + LANGS[langIdx].second
                      setTextColor(Color.WHITE); textSize = 16f; typeface = Typeface.DEFAULT_BOLD
                  })
                  val tv = TextView(this).apply { text = t; setTextColor(Color.WHITE); textSize = 18f; setPadding(0, dp(10), 0, dp(10)) }
                  val sv = ScrollView(this)
                  sv.addView(tv)
                  col.addView(sv, lp(LinearLayout.LayoutParams.MATCH_PARENT, (screenH() * 0.35f).toInt()))
                  col.addView(row(
                      btn("🔊 Leer", true) { start(cardText, LANGS[langIdx].first) },
                      btn("Copiar") {
                          (getSystemService(CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("t", cardText))
                          toast("Copiado")
                      },
                      btn("✕", true) { hideCard() }
                  ))
                  val p = overlay(screenW() - dp(24), WindowManager.LayoutParams.WRAP_CONTENT)
                  p.gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  p.y = dp(20)
                  wm.addView(col, p)
                  card = col
              }
          
              private fun hideCard() {
                  card?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  card = null
              }
          
              // ---------- leer la pantalla de cualquier app ----------
              private fun collect(n: AccessibilityNodeInfo?, out: MutableList<String>, depth: Int = 0) {
                  if (n == null || depth > 80 || !n.isVisibleToUser) return
                  if (!n.isPassword) {
                      val own = n.text?.toString()?.trim()
                      val t = if (!own.isNullOrEmpty()) own
                      else if (n.childCount == 0) n.contentDescription?.toString()?.trim() else null
                      if (!t.isNullOrEmpty() && out.lastOrNull() != t) out.add(t)
                  }
                  for (i in 0 until n.childCount) collect(n.getChild(i), out, depth + 1)
              }
          
              private fun screenText(): String {
                  var root: AccessibilityNodeInfo? = rootInActiveWindow
                  if (root == null || root.packageName == packageName) {
                      root = windows.firstOrNull { it.type == android.view.accessibility.AccessibilityWindowInfo.TYPE_APPLICATION && it.root?.packageName != packageName }?.root
                  }
                  if (root == null) return ""
                  val out = mutableListOf<String>()
                  collect(root, out)
                  return out.joinToString("\n")
              }
          
              private fun readScreen(translate: Boolean, speak: Boolean, forceOcr: Boolean = false) {
                  getText(forceOcr) { text ->
                      if (text.isBlank()) { toast("No encontré texto en la pantalla"); return@getText }
                      if (!translate) { start(text, null); return@getText }
                      toast("Traduciendo…")
                      val tl = LANGS[langIdx].first
                      translateText(text, tl) { r ->
                          if (r == null) toast("No pude traducir. Hace falta internet.")
                          else { showCard(r); if (speak) start(r, tl) }
                      }
                  }
              }
          
              // Texto de la pantalla; si casi no hay texto (PDF, EPUB, imágenes) usa OCR
              private fun getText(forceOcr: Boolean, cb: (String) -> Unit) {
                  val t = screenText()
                  if (!forceOcr && t.length >= 200) { cb(t); return }
                  ocrScreen { o -> cb(if (o != null && o.length > t.length) o else t) }
              }
          
              private fun ocrScreen(cb: (String?) -> Unit) {
                  if (Build.VERSION.SDK_INT < 30) { toast("El OCR requiere Android 11 o superior"); cb(null); return }
                  toast("Leyendo la imagen de la pantalla…")
                  tab?.visibility = View.INVISIBLE
                  main.postDelayed({
                      try {
                          takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                                  tab?.visibility = View.VISIBLE
                                  val hb = r.hardwareBuffer
                                  val bmp = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                                  if (bmp == null) { cb(null); return }
                                  TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                                      .process(InputImage.fromBitmap(bmp, 0))
                                      .addOnSuccessListener { res -> cb(res.text.trim().ifEmpty { null }) }
                                      .addOnFailureListener { cb(null) }
                              }
                              override fun onFailure(errorCode: Int) {
                                  tab?.visibility = View.VISIBLE
                                  toast("No se pudo capturar la pantalla")
                                  cb(null)
                              }
                          })
                      } catch (e: Exception) {
                          tab?.visibility = View.VISIBLE
                          cb(null)
                      }
                  }, 350)
              }
          
              // ---------- voz ----------
              private fun chunks(text: String): List<String> {
                  val out = mutableListOf<String>()
                  text.split(Regex("\n+")).forEach { l0 ->
                      val l = l0.replace(Regex("\\s+"), " ").trim()
                      if (l.isEmpty()) return@forEach
                      val parts = Regex("[^.!?…]+[.!?…]*\\s*").findAll(l).map { it.value }.toList().ifEmpty { listOf(l) }
                      var buf = ""
                      parts.forEach { p ->
                          if (buf.isNotEmpty() && (buf + p).length > 220) { out.add(buf.trim()); buf = "" }
                          buf += p
                          while (buf.length > 260) {
                              var k = buf.lastIndexOf(' ', 240)
                              if (k < 1) k = 240
                              out.add(buf.substring(0, k).trim()); buf = buf.substring(k)
                          }
                      }
                      if (buf.trim().isNotEmpty()) out.add(buf.trim())
                  }
                  return out
              }
          
              private fun start(text: String, lang: String?) {
                  val c = chunks(text)
                  if (c.isEmpty()) { toast("No hay texto para leer"); return }
                  q = c; idx = 0; speakLang = lang
                  speakCurrent()
              }
          
              private fun speakCurrent() {
                  val t = tts
                  if (t == null || !ttsReady) { toast("La voz aún no está lista"); return }
                  if (idx >= q.size) { stopAll(); return }
                  t.setSpeechRate(rate)
                  val lang = speakLang
                  if (lang != null) {
                      t.language = Locale.forLanguageTag(lang)
                  } else {
                      t.language = Locale.getDefault()
                      voices().getOrNull(voiceIdx)?.let { t.voice = it }
                  }
                  playing = true
                  updatePlay()
                  curId = "u" + (++gen)
                  t.speak(q[idx], TextToSpeech.QUEUE_FLUSH, null, curId)
              }
          
              private fun togglePlay() {
                  if (playing) { playing = false; tts?.stop(); updatePlay() }
                  else if (q.isNotEmpty() && idx < q.size) speakCurrent()
                  else { closePanel(); readScreen(false, false) }
              }
          
              private fun step(d: Int) {
                  if (q.isEmpty()) return
                  idx = (idx + d).coerceIn(0, q.size)
                  if (playing) speakCurrent()
              }
          
              private fun stopAll() {
                  gen++; playing = false; tts?.stop(); q = emptyList(); idx = 0; updatePlay()
              }
          
              // ---------- traducción (necesita internet) ----------
              private fun tr1(txt: String, tl: String): String {
                  val u = URL("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" +
                      URLEncoder.encode(tl, "UTF-8") + "&dt=t&q=" + URLEncoder.encode(txt, "UTF-8"))
                  val c = u.openConnection() as HttpURLConnection
                  c.connectTimeout = 10000; c.readTimeout = 15000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  try {
                      val body = c.inputStream.bufferedReader().readText()
                      val arr = JSONArray(body).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until arr.length()) sb.append(arr.getJSONArray(i).optString(0, ""))
                      return sb.toString()
                  } finally { c.disconnect() }
              }
          
              private fun translateText(text: String, tl: String, cb: (String?) -> Unit) {
                  Thread {
                      val res = try {
                          val lines = text.split(Regex("\n+")).map { it.trim() }.filter { it.isNotEmpty() }
                          val out = mutableListOf<String>()
                          var buf = StringBuilder()
                          for (l in lines) {
                              if (buf.length + l.length > 1200) { out.add(tr1(buf.toString(), tl)); buf = StringBuilder() }
                              if (buf.isNotEmpty()) buf.append("\n")
                              buf.append(l)
                          }
                          if (buf.isNotEmpty()) out.add(tr1(buf.toString(), tl))
                          out.joinToString("\n")
                      } catch (e: Exception) { null }
                      main.post { cb(res) }
                  }.start()
              }
          }
